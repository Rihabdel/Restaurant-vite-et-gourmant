security:
    # https://symfony.com/doc/current/security.html#registering-the-user-hashing-passwords
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: "auto"

    # https://symfony.com/doc/current/security.html#loading-the-user-the-user-provider
    providers:
        # used to reload user from session & other features (e.g. switch_user)
        app_user_provider:
            entity:
                class: App\Entity\User
                property: email

    firewalls:
        dev:
            # Ensure dev tools and static assets are always allowed
            pattern: ^/(_profiler|_wdt|assets|build)/
            security: false
        main:
            lazy: true
            provider: app_user_provider
            stateless: true
            custom_authenticator: App\Security\ApiTokenAuthenticator
            json_login:
                check_path: app_api_login
    # Note: Only the *first* matching rule is applied
    role_hierarchy:
        ROLE_ADMIN: [ROLE_EMPLOYEE, ROLE_USER]
        ROLE_EMPLOYEE: [ROLE_USER]
        ROLE_USER: []

    access_control:
        - { path: ^/api/doc, roles: PUBLIC_ACCESS }
        - { path: ^/api/login, roles: PUBLIC_ACCESS }
        - { path: ^/api/registration, roles: PUBLIC_ACCESS }
        # routes de l'API : les routes commençant par /api sont accessibles à tous en lecture (GET), mais nécessitent un rôle ROLE_ADMIN ou ROLE_EMPLOYEE pour les méthodes POST, PUT et DELETE
        - { path: ^/api, roles: PUBLIC_ACCESS, methods: [GET] }
        # routes de l'API : les routes commençant par /api nécessitent un rôle ROLE_ADMIN ou ROLE_EMPLOYEE pour les méthodes POST, PUT et DELETE
        - {
              path: ^/api,
              roles: [ROLE_ADMIN, ROLE_EMPLOYEE],
              methods: [POST, PUT, DELETE],
          }
        #espace administration : les routes commençant par /admin sont réservées aux utilisateurs ayant le rôle ROLE_ADMIN
        - { path: ^/admin, roles: ROLE_ADMIN }

when@test:
    security:
        password_hashers:
            # Password hashers are resource-intensive by design to ensure security.
            # In tests, it's safe to reduce their cost to improve performance.
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4 # Lowest possible value for bcrypt
                time_cost: 3 # Lowest possible value for argon
                memory_cost: 10 # Lowest possible value for argon
